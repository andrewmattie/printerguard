# Fictitious bindings only. Replace these in your private HA configuration.
# Merge this section with your existing configuration; do not overwrite it.
printer_guard:
  ai_task: ai_task.example_vision
  # Optional: use a separate task for the initial single-frame check.
  # If omitted, ai_task is used for both stages.
  screen_ai_task: ai_task.example_screen
  notify_service: notify.example_phone
  printers:
    - name: Printer One
      camera: camera.printer_one
      print_status: sensor.printer_one_print_status
      current_stage: sensor.printer_one_current_stage
      online: binary_sensor.printer_one_online
      print_error: binary_sensor.printer_one_print_error
      task_name: sensor.printer_one_task_name
      start_time: sensor.printer_one_start_time
      # Optional telemetry; omit any fields you do not have.
      current_layer: sensor.printer_one_current_layer
      total_layer_count: sensor.printer_one_total_layer_count
      print_progress: sensor.printer_one_print_progress
      nozzle_temperature: sensor.printer_one_nozzle_temperature
      bed_temperature: sensor.printer_one_bed_temperature
    - name: Printer Two
      camera: camera.printer_two
      print_status: sensor.printer_two_print_status
      current_stage: sensor.printer_two_current_stage
      online: binary_sensor.printer_two_online
      print_error: binary_sensor.printer_two_print_error
      task_name: sensor.printer_two_task_name
      start_time: sensor.printer_two_start_time

# The HA process also needs an existing, writable absolute media directory under
# homeassistant.media_dirs.local. For example, merge this mapping if appropriate:
# homeassistant:
#   media_dirs:
#     local: /media
# Preserve any other media_dirs mappings you need. /media must exist in HA's own
# filesystem/container, and this may make its contents available in HA Media.
